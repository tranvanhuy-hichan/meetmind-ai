[project]
name = "meetmind-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "websockets",
  "sqlalchemy[asyncio]",
  "aiosqlite",
  "pydantic-settings",
  "pyjwt",
  "python-multipart",
  "httpx",
  "python-docx",
  "pypdf",
  "pyyaml",
  "minio",
  "google-auth",
  "requests",
]

[project.optional-dependencies]
whisper = ["faster-whisper"]
postgres = ["asyncpg"]
mysql = ["aiomysql", "cryptography"]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "app*"]
